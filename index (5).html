<!DOCTYPE html>
<html lang="ru" data-theme="royal" data-ui="beta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c09">
<title>Расписание 🌾 БашГАУ PRO v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --bg:#0e0c09;--s:#1a1612;--s2:#28221b;--t:#f8ebc8;--m:#aa9f8a;--l:#3b3225;
  --a:#e5b83a;--ao:#1c1400;--lec:#f0d78a;--prac:#d98a2b;--r:14px;
  --f:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 18px 40px -24px rgba(0,0,0,.8);
}
[data-theme=light]{
  --bg:#f7f7f8;--s:#fff;--s2:#eef0f2;--t:#111318;--m:#5b6472;--l:#dfe3e8;
  --a:#2563eb;--ao:#fff;--lec:#2563eb;--prac:#059669;
  --shadow:0 18px 40px -24px rgba(30,40,60,.25);
}
[data-theme=agro]{--bg:#f3f6f1;--s:#fff;--s2:#e6ede3;--t:#10241a;--m:#586d5e;--l:#d2dcce;--a:#ffd23f;--ao:#1b1500;--lec:#2754d7;--prac:#14803c;--shadow:0 18px 40px -24px rgba(20,40,30,.18)}
[data-theme=cyber]{--bg:#0a0d1c;--s:#131833;--s2:#1c2347;--t:#eef2ff;--m:#93a0c9;--l:#2a3263;--a:#38e1ff;--ao:#001c24;--lec:#7aa2ff;--prac:#c58bff;--shadow:0 18px 40px -24px #000}
[data-theme=amoled]{--bg:#000;--s:#111;--s2:#1c1c1e;--t:#fff;--m:#8e8e93;--l:#2c2c2e;--a:#ff9f0a;--ao:#1a0f00;--lec:#64d2ff;--prac:#30d158;--shadow:none}
[data-theme=tactical]{--bg:#0b0f0a;--s:#151c13;--s2:#1e281b;--t:#e4f5c4;--m:#86a37a;--l:#2d3d28;--a:#e8c21a;--ao:#141000;--lec:#e8c21a;--prac:#8fd321;--r:4px;--f:'Courier New',Consolas,monospace;--shadow:none}
[data-theme=sakura]{--bg:#190d20;--s:#271533;--s2:#35204a;--t:#fdeefa;--m:#cfa8e0;--l:#4a2d63;--a:#ff7aa8;--ao:#2a0618;--lec:#ffb3cf;--prac:#c9a0ff;--r:24px;--shadow:0 18px 40px -24px #000}
[data-theme=matrix]{--bg:#020a04;--s:#06160a;--s2:#0c2814;--t:#c9ffd9;--m:#38c26a;--l:#124a24;--a:#00ff66;--ao:#00200c;--lec:#6effa8;--prac:#20c060;--r:3px;--f:'Courier New',Consolas,monospace;--shadow:none}

html{background:var(--bg)}
body{
  font-family:var(--f);background:var(--bg);color:var(--t);
  padding-bottom:100px;min-height:100vh;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(color-mix(in srgb,var(--t) 8%,transparent) 1px,transparent 1.4px);
  background-size:18px 18px;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
main{max-width:620px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 0}

/* ---------- Header ---------- */
.bar{display:flex;align-items:center;gap:8px}
.hd{flex:1;min-width:0}
.hd .d0{display:flex;align-items:center;gap:6px}
.hd span#dateT{font-size:.78rem;color:var(--m);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{font-size:.6rem;font-weight:800;letter-spacing:.1em;background:var(--t);color:var(--bg);padding:2px 6px;border-radius:6px;cursor:pointer;flex-shrink:0;transition:transform .12s}
.lg:active{transform:scale(.88)}
.ib{
  width:40px;height:40px;border-radius:calc(var(--r)*.8);
  background:var(--s);border:1px solid var(--l);font-size:1rem;flex-shrink:0;
  display:grid;place-items:center;transition:transform .12s,background .2s;
}
.ib:active{transform:scale(.92)}
.ib.on{background:var(--a);color:var(--ao);border-color:var(--a)}

/* ---------- Next lesson widget ---------- */
.nx{
  margin-top:12px;padding:14px 16px;border-radius:calc(var(--r)*1.4);
  background:linear-gradient(135deg,var(--lec),var(--prac));color:#0a0a0a;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:transform .12s;
}
.nx:active{transform:scale(.985)}
.nx.live{background:var(--a);color:var(--ao)}
.nx-ic{font-size:1.8rem;line-height:1;flex-shrink:0}
.nx-b{flex:1;min-width:0}
.nx-b small{display:block;font-size:.72rem;font-weight:700;opacity:.75;letter-spacing:.02em}
.nx-b strong{display:block;font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.nx-b span{display:block;font-size:.74rem;font-weight:600;opacity:.75;margin-top:1px}
.nx-em{
  font-style:normal;font-weight:800;font-size:.82rem;padding:6px 11px;border-radius:99px;
  background:rgba(0,0,0,.14);white-space:nowrap;flex-shrink:0;
}
.nx.live .nx-em{background:var(--ao);color:var(--a)}

/* ---------- Search ---------- */
.qw{display:none;margin-top:10px}
.qw.on{display:block}
input,select{
  width:100%;background:var(--s);border:1px solid var(--l);
  border-radius:calc(var(--r)*.7);padding:11px 12px;font-size:.9rem;outline:none;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}

/* ---------- Segmented controls ---------- */
.seg,.stp{display:flex;background:var(--s2);border-radius:99px;padding:4px;gap:4px;margin-top:10px}
.seg button,.stp button{
  flex:1;padding:8px 6px;border-radius:99px;font-weight:700;font-size:.8rem;
  color:var(--m);white-space:nowrap;transition:background .2s,color .2s;
}
.seg .on{background:var(--t);color:var(--bg)}
.stp{flex:1.3}
.stp button:nth-child(odd){font-size:1.35rem;line-height:1;flex:.55;color:var(--t);padding:4px 0}
.stp button:nth-child(2){flex:3}
.row2{display:flex;gap:8px}
.row2 .seg{flex:1}

/* ---------- Progress ---------- */
.pg{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.72rem;font-weight:600;color:var(--m)}
.pg span{white-space:nowrap}
.pg i{flex:1;height:5px;background:var(--s2);border-radius:9px;overflow:hidden}
.pg b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lec),var(--prac));border-radius:9px;transition:width .8s}

/* ---------- Days ---------- */
.days{
  position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;margin-top:2px;
}
.days button{
  padding:7px 0;border-radius:calc(var(--r)*.8);font-weight:800;font-size:.72rem;
  color:var(--m);display:flex;flex-direction:column;gap:1px;position:relative;
  transition:transform .12s,background .2s;
}
.days button:active{transform:scale(.93)}
.days small{font-size:1rem;font-weight:800;color:var(--t)}
.days .on{background:linear-gradient(135deg,var(--lec),var(--prac));color:var(--bg)}
.days .on small{color:var(--bg)}
.days .td::after{content:'';position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--lec)}
.days .on.td::after{background:var(--a)}
.lc{font-style:normal;font-size:.5rem;letter-spacing:1px;line-height:1;height:7px;color:var(--lec)}
.days .on .lc{color:var(--bg)}

/* ---------- Bells strip ---------- */
.bls{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin:2px 0 10px;font-size:.74rem;color:var(--m);font-weight:600;
}
.bls span{background:var(--s2);border:1px solid var(--l);border-radius:99px;padding:3px 9px;font-weight:700}

/* ---------- Classic list ---------- */
.L{display:grid;grid-template-columns:50px 16px 1fr;gap:0 8px;--c:var(--lec)}
.L.prac{--c:var(--prac)}
.tm{padding-top:12px;text-align:right}
.tm b{display:block;font-size:1.02rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tm span{display:block;font-size:.72rem;color:var(--m);font-weight:600;font-variant-numeric:tabular-nums}
.tm i{display:block;font-style:normal;font-size:.66rem;color:var(--m);margin-top:6px}
.rl{position:relative}
.rl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--l)}
.L:first-child .rl::before{top:18px}
.L:last-child .rl::before{bottom:auto;height:18px}
.rl u{position:absolute;left:1px;top:13px;width:14px;height:14px;border-radius:50%;border:3px solid var(--c);background:var(--bg)}
.prac .rl u{background:var(--c)}
.cur .rl u{border-color:var(--a);background:var(--a);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--a)}
.cd{
  background:var(--s);border:1px solid var(--l);border-radius:var(--r);
  padding:12px;margin-bottom:10px;min-width:0;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s;
}
.cd:active{transform:scale(.985)}
.cur .cd{border:2px solid var(--a);padding:11px;background:color-mix(in srgb,var(--a) 14%,var(--s))}
.past{opacity:.55}
.tp{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tp strong{font-size:.98rem;font-weight:700;line-height:1.25}
.rm{flex-shrink:0;max-width:42%;text-align:center;background:var(--t);color:var(--bg);border-radius:calc(var(--r)*.6);padding:4px 8px;font-weight:800;font-size:.8rem}
.mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.mt::after{content:'⌄';margin-left:auto;color:var(--m);font-weight:800;font-size:1rem;line-height:.6}
.open .mt::after{content:'⌃'}
.ch{font-size:.7rem;font-weight:700;color:var(--m);border:1px solid var(--l);border-radius:99px;padding:2px 8px}
.ty{border-color:var(--c);color:var(--c)}
.prac .ty{background:var(--c);color:var(--bg)}
.ch.lv{background:var(--a);border-color:var(--a);color:var(--ao)}
.dt{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--l)}
.open .dt{display:block}
.dt p{font-size:.72rem;color:var(--m)}
.dt b{display:block;font-size:.9rem;margin:2px 0 10px}
.gp{display:grid;grid-template-columns:50px 16px 1fr;gap:0 8px;margin-top:-4px;padding-bottom:10px}
.gp span{justify-self:start;align-self:center;font-size:.72rem;font-weight:700;color:var(--m);border:1px dashed var(--m);border-radius:99px;padding:3px 11px;background:var(--bg)}
.empty{text-align:center;padding:44px 16px;color:var(--m);font-size:.9rem}
.empty b{display:block;color:var(--t);font-size:1.1rem;margin:8px 0 4px}
.an .L{animation:in .35s both;animation-delay:calc(var(--i)*40ms)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

/* ---------- Beta: dial + ticket cards ---------- */
.dl-w{padding-top:6px}
.dl{position:relative;width:100%;max-width:340px;margin:0 auto}
.dl svg{display:block;width:100%;height:auto;overflow:visible}
.dcore{fill:color-mix(in srgb,var(--s) 70%,transparent)}
.tr{fill:none;stroke:color-mix(in srgb,var(--t) 9%,transparent);stroke-width:13}
.tc{stroke:var(--m);stroke-width:1.5;opacity:.5}
.hl{font:700 11px var(--f);fill:var(--m);text-anchor:middle;dominant-baseline:middle}
.ar{fill:none;stroke-width:13;stroke-linecap:round;stroke:var(--lec);cursor:pointer;stroke-dasharray:1;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--lec) 70%,transparent))}
.ar.prac{stroke:var(--prac);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--prac) 70%,transparent))}
.ar.cur{stroke:var(--a);filter:drop-shadow(0 0 7px var(--a))}
.ar.past{opacity:.35}
.an .ar{animation:dr 1s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*110ms)}
@keyframes dr{from{stroke-dashoffset:1}}
.hnd{stroke:var(--a);stroke-width:3;stroke-linecap:round}
.hdd{fill:var(--a)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 23%;pointer-events:none;gap:2px}
.dc small{font-size:.72rem;font-weight:700;color:var(--m)}
.dc b{white-space:nowrap;font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.dc span{font-size:.76rem;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prg{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--a))}
.cs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 16px}
.cs span{font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--s) 70%,transparent);border:1px solid var(--l);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tk{--c:var(--lec);display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:20px;cursor:pointer;background:var(--s);border:1px solid var(--l);box-shadow:var(--shadow);transition:transform .12s}
.tk:active{transform:scale(.985)}
.tk.prac{--c:var(--prac)}
.tt{width:60px;flex-shrink:0;text-align:center;background:var(--c);color:#0a0a0a;border-radius:14px;padding:6px 0}
.tt b{display:block;font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tt small{font-size:.66rem;font-weight:700;opacity:.8}
.tx{flex:1;min-width:0;border-left:2px dashed var(--l);padding-left:12px}
.tx strong{display:block;font-size:.92rem;line-height:1.25}
.tx span{font-size:.72rem;font-weight:700;color:var(--m)}
.tk em{font-style:normal;font-weight:800;font-size:.78rem;background:var(--t);color:var(--bg);border-radius:99px;padding:4px 10px;flex-shrink:0;max-width:34%;text-align:center}
.tk.cur{outline:2px solid var(--a);outline-offset:2px}
.tk.past{opacity:.5}
.an .tk{animation:in .4s both;animation-delay:calc(var(--i)*60ms + 300ms)}
.gw{text-align:center;font-size:.72rem;font-weight:700;color:var(--m);margin:-2px 0 8px}

/* ---------- Dock ---------- */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:596px;z-index:30;
  display:flex;gap:6px;padding:8px;
  background:color-mix(in srgbg,var(--s) 80%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--l);border-radius:24px;box-shadow:var(--shadow);
}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:18px;font-weight:800;font-size:.7rem;white-space:nowrap;transition:transform .12s,background .2s}
.dock button:active{transform:scale(.94)}
.dock i{font-style:normal;font-size:1.2rem;line-height:1}
.dock .pr{background:var(--a);color:var(--ao)}

/* ---------- Sheet ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{
  width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:calc(var(--r)*1.5) calc(var(--r)*1.5) 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  animation:up .3s cubic-bezier(.22,1,.36,1);
}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:9px;background:var(--l);margin:-4px auto 12px;flex-shrink:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.1rem}
#shB{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#shB h4,label{font-size:.76rem;font-weight:800;color:var(--m);margin-top:6px}
.mi{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px;background:var(--s);border:1px solid var(--l);
  border-radius:calc(var(--r)*.8);font-weight:700;font-size:.9rem;
  text-decoration:none;color:var(--t);transition:transform .12s;
}
.mi:active{transform:scale(.985)}
.mi>span{font-size:1.2rem}
.mi>div{flex:1;min-width:0}
.mi small{display:block;font-weight:500;color:var(--m);font-size:.74rem;margin-top:2px}
.hint{font-size:.8rem;color:var(--m);line-height:1.45}
.pb{width:100%;padding:13px;border-radius:calc(var(--r)*.8);background:var(--a);color:var(--ao);font-weight:800;transition:transform .12s}
.pb:active{transform:scale(.98)}
.g3{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
.g3 button{padding:9px 4px;border:1px solid var(--l);border-radius:calc(var(--r)*.6);background:var(--s);font-weight:800;font-size:.8rem}
.g3 .on{background:var(--t);color:var(--bg)}
.wg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wg button{padding:9px 4px;border:1px solid var(--l);border-radius:calc(var(--r)*.6);background:var(--s);font-weight:800;font-size:.8rem}
.wg .on{background:var(--t);color:var(--bg)}
.wg .rw{box-shadow:inset 0 0 0 2px var(--a)}
.fd{background:var(--s);border:1px solid var(--l);border-radius:calc(var(--r)*.8);padding:10px 12px;font-size:.8rem}
.fd>b{display:flex;justify-content:space-between;margin-bottom:6px}
.fd>div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--l)}
.fd em{font-style:normal;font-weight:800;color:var(--prac);white-space:nowrap}
.br{display:flex;justify-content:space-between;padding:12px;background:var(--s);border:1px solid var(--l);border-radius:calc(var(--r)*.8);font-weight:700}
.bk{text-align:center;font-size:.76rem;color:var(--m);font-weight:700}
.r2{display:flex;gap:6px}
pre{white-space:pre-wrap;text-align:center;font:.78rem/1.5 'Times New Roman',serif;background:var(--s2);border:1px dashed var(--m);border-radius:calc(var(--r)*.8);padding:14px}
.cb{background:var(--s2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.zp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.72rem;color:var(--m)}
.zp button{padding:6px 10px;border:1px solid var(--l);border-radius:calc(var(--r)*.6);background:var(--s);font-weight:800;font-size:.76rem}
.zp .on{background:var(--a);color:var(--ao);border-color:var(--a)}
#molarRes{background:var(--s);border-radius:calc(var(--r)*.6);padding:8px 10px;font-size:.82rem;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:.82rem}
td,th{padding:7px 8px;border-bottom:1px solid var(--l);text-align:left}
th{color:var(--prac)}
thead th{color:var(--m);font-size:.72rem}
.r{text-align:right;font-weight:800}
.ft{text-align:center;font-size:.72rem;color:var(--m);line-height:1.5;margin-top:6px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;
  transform:translate(-50%,-90px);background:var(--t);color:var(--bg);
  padding:11px 20px;border-radius:99px;font-weight:800;font-size:.84rem;
  z-index:99;transition:transform .4s;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.on{transform:translate(-50%,0)}

/* ---------- Game ---------- */
#gm{position:fixed;inset:0;z-index:95;background:var(--bg)}
#gc{display:block;touch-action:none}
.gx{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}
#gb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:color-mix(in srgb,var(--bg) 82%,transparent)}
#gb b{font-size:2rem}
#gb .pb,#gb .mi{max-width:280px}

/* ---------- Weather ---------- */
.wx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;margin:2px 0 10px;border-radius:calc(var(--r)*.9);background:var(--s2);border:1px solid var(--l)}
.wi{font-size:1.6rem;line-height:1}
.wx b{display:block;font-size:.82rem}
.wx small{display:block;font-size:.72rem;color:var(--m);font-weight:600}
.wx i{margin-left:auto;font-style:normal;color:var(--m);font-size:1.2rem}
